<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>Document</title>
</head>
<body>
  <section class="contact-us">
    <div class="container">
        <h3 class="contact-us-header">Зв'яжіться з нами</h3>
        <div class="form-container">
            <form class="contact-form" action="">
                <h3 class="form-header">Ми готові допомогти Вам</h3>
                <input type="text" class="contact-input" id="fullname" name="fullname" placeholder="ПІБ">
                <input type="text" class="contact-input" id="phone" name="phone" placeholder="Номер телефону">
                <input type="email" class="contact-input" id="email" name="email" pattern=".+@example\.com"
                    placeholder="Пошта">
                <input type="text" class="contact-input" id="theme" name="theme" placeholder="Тема">
                <textarea class="contact-input" id="description" name="description"
                    placeholder="Опис звернення"></textarea>
                <button class="action-btn contact-btn">Відправити</button>
            </form>
        </div>
    </div>
</section>
<script src="./script.js"></script>
</body>
</html>
